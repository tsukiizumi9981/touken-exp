<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>刀剣乱舞ONLINE｜等級換算器</title>
<style>
:root{--ink:#25231f;--muted:#716c63;--paper:#f7f4ed;--card:#fffdf8;--line:#ded8cb;--gold:#9b7a34;--gold2:#c7a55b;--red:#8b3f3c;--shadow:0 18px 50px rgba(48,42,31,.11)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:radial-gradient(circle at 15% 0%,#fff 0,transparent 35%),linear-gradient(135deg,#f7f3e9,#ebe5d8);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(117,102,73,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(117,102,73,.08) 1px,transparent 1px);background-size:28px 28px}
.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:42px 0 56px;position:relative}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:800;margin-bottom:7px}
h1{font-family:"Noto Serif TC","PMingLiU",serif;font-size:clamp(30px,6vw,52px);line-height:1.05;margin:0;letter-spacing:.04em}
.notice{margin:12px 0 0;color:var(--red);font-size:14px;font-weight:700;line-height:1.65}.sub{color:var(--muted);margin:5px 0 0;line-height:1.7}
.badge{white-space:nowrap;border:1px solid var(--line);background:rgba(255,253,248,.7);padding:8px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.panel{background:rgba(255,253,248,.93);border:1px solid rgba(189,176,148,.55);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);background:#f4efe4}
.tab{appearance:none;border:0;background:transparent;padding:16px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer;position:relative}
.tab.active{color:var(--red);background:var(--card)}
.tab.active:after{content:"";position:absolute;left:24%;right:24%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.content{padding:26px}
.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px}
select,input{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px 15px;font:inherit;background:#fff;color:var(--ink);outline:none;transition:.2s}
select:focus,input:focus{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(199,165,91,.16)}
.inputwrap{position:relative}
.inputwrap input{padding-right:58px;font-variant-numeric:tabular-nums}
.unit{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:800;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.result{margin-top:24px;border-top:1px solid var(--line);padding-top:23px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,#2c2a26,#4a4438);color:#fff;border-radius:18px;padding:22px 24px}
.hero small{display:block;color:#d9d1c1;letter-spacing:.12em;margin-bottom:5px}
.level{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(42px,9vw,70px);line-height:1;font-weight:700}
.hero-note{text-align:right;color:#e8dfcf;font-size:14px;line-height:1.65}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}
.card span{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.card strong{font-size:18px;font-variant-numeric:tabular-nums}
.progress-row{margin-top:17px}
.progress-meta{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.progress{height:12px;background:#e9e3d7;border-radius:99px;overflow:hidden;border:1px solid #ddd4c3}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#d8bb73);border-radius:inherit;transition:width .35s ease}
.empty{text-align:center;padding:34px 12px;color:var(--muted)}
.table-toggle{margin-top:18px;display:flex;justify-content:flex-end}
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.table-wrap{display:none;margin-top:12px;max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:13px}
.table-wrap.show{display:block}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th,td{padding:10px 12px;border-bottom:1px solid #eee9df;text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center}
th{position:sticky;top:0;background:#f3eee3;color:var(--muted);z-index:1}
tr.current td{background:#fff3dc;font-weight:800;color:#6d4f18}
footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin-top:20px}
.hidden{display:none!important}
@media(max-width:680px){.wrap{padding-top:26px}header{display:block}.badge{display:inline-block;margin-top:14px}.content{padding:18px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.hero{align-items:flex-start}.hero-note{font-size:12px}}
</style>
</head>

<header><div><div class="eyebrow">TOUKEN RANBU ONLINE</div><h1>等級換算器</h1><p class="notice">※本網站僅供輸入初刀的累積經驗值進行換算。</p><p class="sub">依刀種換算極刀劍 Lv.1～199 的累計經驗值。劍可與大太刀共用。</p></div><div class="badge">資料內建・可離線使用</div></header>

const fmt=n=>n==null?'—':new Intl.NumberFormat('zh-TW').format(n);
const typeEl=document.querySelector('#type'),expEl=document.querySelector('#exp'),levelEl=document.querySelector('#levelInput');
const result=document.querySelector('#result'),rangeHint=document.querySelector('#rangeHint'),tbody=document.querySelector('#tbody');
let mode='exp';
Object.keys(DATA).forEach(k=>typeEl.add(new Option(k.replace(' レア','（稀有度')+(k.includes('レア')?'）':''),k)));
function rawNumber(s){return Number(String(s).replace(/[^0-9]/g,''));}
function updateHint(){const a=DATA[typeEl.value];rangeHint.textContent=`此刀種資料範圍：${fmt(a[0].totalExp)} ～ ${fmt(a.at(-1).totalExp)} EXP`;}
function findLevel(arr,x){let lo=0,hi=arr.length-1,ans=-1;while(lo<=hi){const m=(lo+hi)>>1;if(arr[m].totalExp<=x){ans=m;lo=m+1}else hi=m-1}return ans;}
function hero(entry,extra,progress=0,progressText=''){return `<div class="hero"><div><small>目前等級</small><div class="level">Lv.${entry.level}</div></div><div class="hero-note">${extra}</div></div><div class="cards"><div class="card"><span>目前等級起始 EXP</span><strong>${fmt(entry.totalExp)}</strong></div><div class="card"><span>升至下一級所需</span><strong>${fmt(entry.nextExp)}</strong></div><div class="card"><span>距離下一級尚差</span><strong>${entry.nextExp==null?'已達最高等級':fmt(Math.max(0,entry.totalExp+entry.nextExp-rawNumber(expEl.value)))}</strong></div></div><div class="progress-row"><div class="progress-meta"><span>本級進度</span><span>${progressText}</span></div><div class="progress"><i style="width:${progress}%"></i></div></div>`;}
function renderExp(){const arr=DATA[typeEl.value],x=rawNumber(expEl.value);if(!expEl.value.trim()||!Number.isFinite(x)){result.innerHTML='<div class="empty">輸入累計 EXP 後，會立即顯示對應等級。</div>';highlight(null);return}const idx=findLevel(arr,x);if(idx<0){const need=arr[0].totalExp-x;result.innerHTML=`<div class="hero"><div><small>尚未達到資料起點</small><div class="level">Lv.—</div></div><div class="hero-note">距離 Lv.1 尚差<br><b>${fmt(need)} EXP</b></div></div>`;highlight(null);return}const e=arr[idx];let pct=100,text='最高等級';if(e.nextExp!=null){pct=Math.min(100,Math.max(0,(x-e.totalExp)/e.nextExp*100));text=`${fmt(x-e.totalExp)} / ${fmt(e.nextExp)} EXP（${pct.toFixed(1)}%）`}result.innerHTML=hero(e,e.nextExp==null?'已達 Lv.199<br>最高等級':`下一級：Lv.${e.level+1}<br>累計 ${fmt(e.totalExp+e.nextExp)} EXP`,pct,text);highlight(e.level)}
function renderLevel(){const arr=DATA[typeEl.value];let lv=Math.max(1,Math.min(199,parseInt(levelEl.value)||1));levelEl.value=lv;const e=arr[lv-1];result.innerHTML=`<div class="hero"><div><small>目標等級</small><div class="level">Lv.${lv}</div></div><div class="hero-note">到達此等級所需<br><b>${fmt(e.totalExp)} EXP</b></div></div><div class="cards"><div class="card"><span>必要累計 EXP</span><strong>${fmt(e.totalExp)}</strong></div><div class="card"><span>升至下一級所需</span><strong>${fmt(e.nextExp)}</strong></div><div class="card"><span>下一級累計 EXP</span><strong>${e.nextExp==null?'最高等級':fmt(e.totalExp+e.nextExp)}</strong></div></div>`;highlight(lv)}
function buildTable(){tbody.innerHTML=DATA[typeEl.value].map(e=>`<tr data-lv="${e.level}"><td>${e.level}</td><td>${fmt(e.totalExp)}</td><td>${fmt(e.nextExp)}</td></tr>`).join('')}
function highlight(lv){tbody.querySelectorAll('tr.current').forEach(x=>x.classList.remove('current'));if(lv){const r=tbody.querySelector(`[data-lv="${lv}"]`);if(r)r.classList.add('current')}}
function render(){updateHint();buildTable();mode==='exp'?renderExp():renderLevel()}
expEl.addEventListener('input',()=>{const digits=expEl.value.replace(/\D/g,'');expEl.value=digits?fmt(Number(digits)):'';renderExp()});
levelEl.addEventListener('input',renderLevel);typeEl.addEventListener('change',render);
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelector('#expField').classList.toggle('hidden',mode!=='exp');document.querySelector('#levelField').classList.toggle('hidden',mode!=='level');mode==='exp'?renderExp():renderLevel()}));
document.querySelector('#toggleTable').addEventListener('click',e=>{const w=document.querySelector('#tableWrap');w.classList.toggle('show');e.target.textContent=w.classList.contains('show')?'隱藏完整經驗值表':'顯示完整經驗值表'});
render();
</script>
